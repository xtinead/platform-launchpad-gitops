apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: platform-launchpad-runtime
  namespace: platform-launchpad
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "platform-launchpad/runtime"
        objectType: "secretsmanager"
        jmesPath:
          - path: "database_url"
            objectAlias: "database_url"
          - path: "secret_key"
            objectAlias: "secret_key"