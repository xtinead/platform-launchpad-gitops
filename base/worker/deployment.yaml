apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: platform-launchpad
  labels:
    app.kubernetes.io/name: platform-launchpad-worker
    app.kubernetes.io/part-of: platform-launchpad
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: platform-launchpad-worker

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-launchpad-worker
        app.kubernetes.io/part-of: platform-launchpad

    spec:
      serviceAccountName: worker

      containers:
        - name: worker
          image: platform-launchpad-backend
          imagePullPolicy: IfNotPresent

          command:
            - python
            - -m
            - app.worker

          env:
            - name: APP_ENVIRONMENT
              value: development

            - name: DEBUG
              value: "false"

            - name: DATABASE_URL_FILE
              value: /mnt/secrets-store/database_url

            - name: SECRET_KEY_FILE
              value: /mnt/secrets-store/secret_key

            - name: WORKER_POLL_INTERVAL_SECONDS
              value: "5"

          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: runtime-secrets
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: runtime-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: platform-launchpad-runtime