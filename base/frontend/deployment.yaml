apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: platform-launchpad
  labels:
    app.kubernetes.io/name: platform-launchpad-frontend
    app.kubernetes.io/part-of: platform-launchpad
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: platform-launchpad-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-launchpad-frontend
        app.kubernetes.io/part-of: platform-launchpad

    spec:
      containers:
        - name: frontend
          image: platform-launchpad-frontend
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: production

            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

            - name: PORT
              value: "3000"

            - name: HOSTNAME
              value: "0.0.0.0"

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL