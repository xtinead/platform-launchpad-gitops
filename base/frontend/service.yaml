apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: platform-launchpad
  labels:
    app.kubernetes.io/name: platform-launchpad-frontend
    app.kubernetes.io/part-of: platform-launchpad
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: platform-launchpad-frontend

  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP